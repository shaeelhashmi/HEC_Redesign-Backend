<script>

 window.addEventListener('load', async function () {
  await Clerk.load({
    ui: { ClerkUI: window.__internal_ClerkUICtor },
  })

  // If Clerk is signed in, redirect to sso-callback 
  if (Clerk.user) {
    window.location.href = '/admin/callback'; 
  } else {
    document.getElementById('app').innerHTML = `
      <div id="sign-in" style="display: flex; justify-content: center; align-items: center; height: 100vh;"></div>
    `
    const signInDiv = document.getElementById('sign-in')
    
    // PASS OPTIONS HERE TO HIDE SIGNUP
    Clerk.mountSignIn(signInDiv, {
      routing: "virtual",
      signUpUrl: "", // Overrides and removes the signup link button/footer text
    })
  }
})
</script>

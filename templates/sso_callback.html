<!DOCTYPE html>
<html>
<head>
  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_Y3Jpc3Atc2hhZC05My5jbGVyay5hY2NvdW50cy5kZXYk"
    src="https://crisp-shad-93.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
   <script>
    window.addEventListener('load', async () => {
      await Clerk.load();

      if (Clerk.user) {
        window.location.replace('/dashboard');
        return;
      }

      document.getElementById('submit-btn').addEventListener('click', async () => {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorEl  = document.getElementById('error');
        errorEl.textContent = '';

        try {
          const result = await Clerk.client.signIn.create({
            identifier: email,
            password: password,
          });

          if (result.status === 'complete') {
            await Clerk.setActive({ session: result.createdSessionId });
            window.location.replace('/dashboard');
          }

        } catch (err) {
          errorEl.textContent = err.errors?.[0]?.message ?? 'Sign in failed.';
        }
      });
    });
  </script>
</head>
<body></body>
</html>
